name: Build APK ARKAIOS Android

on:
  push:
    paths:
      - 'android-app/**'
    branches: [ MAIN, main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias npm
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ARKAIOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ARKAIOS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "APK_PATH=android-app/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto ARKAIOS_KEYSTORE_BASE64: se publica APK debug (no se actualiza encima de la version firmada)"
            echo "APK_PATH=android-app/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          ARKAIOS_KEYSTORE_PASSWORD: ${{ secrets.ARKAIOS_KEYSTORE_PASSWORD }}
          ARKAIOS_KEY_ALIAS: ${{ secrets.ARKAIOS_KEY_ALIAS }}
          ARKAIOS_KEY_PASSWORD: ${{ secrets.ARKAIOS_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$ARKAIOS_KEYSTORE_FILE" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Nombrar APK
        working-directory: .
        run: cp "$APK_PATH" "ARKAIOS-Educacion-Libre-v2.0.${{ github.run_number }}.apk"

      - name: Crear Release y Subir APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0.${{ github.run_number }}"
          name: "ARKAIOS Educacion Libre Android v2.0.${{ github.run_number }}"
          files: ARKAIOS-Educacion-Libre-v2.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
