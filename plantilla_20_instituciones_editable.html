<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantilla 20 instituciones – Vida libre de violencia (MX)</title>
<style>
  :root { --acc:#6b7fe0; --ink:#2d3a63; --line:#9db0d8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#eef0f6; color:#222; }
  .toolbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid #d5d9e6;
    padding:10px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .toolbar button { border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; background:var(--acc); color:#fff; }
  .toolbar button.danger { background:#d9534f; }
  .toolbar button.alt { background:#e3e7f5; color:var(--ink); }
  .toolbar .hint { font-size:12.5px; color:#555; flex:1 1 280px; }
  .page { width:216mm; min-height:279mm; margin:14px auto; background:#fff; padding:8mm; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr; height:263mm; border-top:1.5px dashed var(--line); border-left:1.5px dashed var(--line); }
  .cell { position:relative; border-right:1.5px dashed var(--line); border-bottom:1.5px dashed var(--line);
    padding:8px 6px 6px; display:flex; flex-direction:column; align-items:center; min-height:0; }
  .num { position:absolute; top:6px; left:6px; background:var(--acc); color:#fff; font-size:10px; font-weight:bold; padding:3px 7px; border-radius:4px; }
  .slot { margin-top:18px; width:100%; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
    position:relative; border-radius:6px; cursor:pointer; outline:2px solid transparent; }
  .slot:hover { background:#f4f6fc; }
  .slot.sel { outline:2px solid var(--acc); background:#eef1ff; }
  .slot img { max-width:100%; max-height:100%; object-fit:contain; display:none; }
  .slot.has img { display:block; }
  .ph { display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; }
  .slot.has .ph { display:none; }
  .circle { width:70px; height:70px; border-radius:50%; border:1.5px solid var(--line); background:#f3f5fb;
    display:flex; align-items:center; justify-content:center; text-align:center; font-weight:bold; color:var(--ink); font-size:13px; padding:4px; overflow:hidden; }
  .phlabel { font-size:8px; color:#8a93ad; letter-spacing:.03em; }
  .del { position:absolute; top:2px; right:2px; width:20px; height:20px; border:0; border-radius:50%; background:#d9534f; color:#fff;
    font-size:12px; line-height:20px; cursor:pointer; display:none; padding:0; }
  .slot.has:hover .del { display:block; }
  .name { margin-top:6px; font-size:10.5px; font-weight:bold; color:var(--ink); text-align:center; min-height:2.6em; width:100%; padding:2px; }
  [contenteditable]:focus { outline:1.5px solid var(--acc); border-radius:3px; background:#fffbe6; }
  @media (max-width:760px) { .page { width:100%; padding:6px; } .grid { height:auto; grid-template-columns:repeat(2,1fr); } .cell { min-height:200px; } }
  body > .ark-img-bar { max-width:216mm; margin:12px auto 0; }
  @page { size: letter portrait; margin: 6mm; }
  @media print {
    body { background:#fff; }
    .toolbar { display:none !important; }
    .page { margin:0; box-shadow:none; width:auto; min-height:0; padding:0; }
    .grid { height:262mm; grid-template-columns:repeat(4,1fr); }
    .phlabel, .del { display:none !important; }
    .slot, .slot:hover, .slot.sel { outline:none; background:none; }
    [contenteditable]:focus { outline:none; background:none; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <button class="alt" onclick="pickFile()">📁 Subir imagen</button>
  <button class="danger" onclick="clearImages()">Borrar imágenes</button>
  <button class="danger" onclick="clearAll()">Borrar todo</button>
  <span class="hint"><b>Cómo usar:</b> copia una imagen en internet (clic derecho → <i>Copiar imagen</i>), haz clic en un recuadro y presiona <b>Ctrl+V</b> (⌘+V en Mac). También puedes arrastrar archivos. Los textos se editan con un clic. Para guardar PDF elige «Guardar como PDF» al imprimir.</span>
</div>
<input type="file" id="file" accept="image/*" hidden>

<div class="page"><div class="grid" id="grid"></div></div>
<script src="js/arkaios-imagenes.js"></script>

<script>
const DATA = [
 ["MUJERES","Secretaría de las Mujeres"],["SEGOB","Secretaría de Gobernación"],["BIENESTAR","Secretaría de Bienestar"],["SSPC","Seguridad y Protección Ciudadana"],
 ["FGR","Fiscalía General de la República"],["SEP","Secretaría de Educación Pública"],["CULTURA","Secretaría de Cultura"],["SALUD","Secretaría de Salud"],
 ["STPS","Trabajo y Previsión Social"],["SEDATU","Desarrollo Agrario, Territorial y Urbano"],["CONAPRED","Consejo Nacional para Prevenir la Discriminación"],["DIF","Sistema Nacional DIF"],
 ["INPI","Instituto Nacional de los Pueblos Indígenas"],["INE","Instituto Nacional Electoral"],["CEAV","Comisión Ejecutiva de Atención a Víctimas"],["CNDH","Comisión Nacional de los Derechos Humanos"],
 ["CONAVIM","Comisión Nacional para Prevenir y Erradicar la Violencia contra las Mujeres"],["SIPINNA","Sistema Nacional de Protección de Niñas, Niños y Adolescentes"],["CJM","Centros de Justicia para las Mujeres"],["ONU MUJERES","ONU Mujeres"]
];
const KEY = "plantilla20_v1";
const grid = document.getElementById("grid");
let selected = null;
let state = load();

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ console.warn("No se pudo guardar localmente", e); } }

DATA.forEach((d,i)=>{
  const s = state[i] || {};
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = `
    <span class="num">${i+1}</span>
    <div class="slot" data-i="${i}" tabindex="0">
      <img alt="" draggable="false">
      <div class="ph"><div class="circle" contenteditable="true" spellcheck="false" data-f="abbr"></div><span class="phlabel">LOGOTIPO / IMAGEN</span></div>
      <button class="del" title="Quitar imagen">✕</button>
    </div>
    <div class="name" contenteditable="true" spellcheck="false" data-f="name"></div>`;
  cell.querySelector('[data-f="abbr"]').textContent = s.abbr ?? d[0];
  cell.querySelector('[data-f="name"]').textContent = s.name ?? d[1];
  const slot = cell.querySelector(".slot");
  if (s.img) setImg(slot, s.img);
  grid.appendChild(cell);
});

function setImg(slot, src){
  const img = slot.querySelector("img");
  if (src){ img.src = src; slot.classList.add("has"); } else { img.removeAttribute("src"); slot.classList.remove("has"); }
}
function idx(slot){ return +slot.dataset.i; }
function put(slot, src){ const i = idx(slot); state[i] = state[i] || {}; state[i].img = src || null; setImg(slot, src); save(); }

function select(slot){
  document.querySelectorAll(".slot.sel").forEach(s=>s.classList.remove("sel"));
  selected = slot; if (slot) slot.classList.add("sel");
  if (window.ArkImagenes) ArkImagenes.select(slot ? idx(slot) : -1);
}
grid.addEventListener("click", e=>{
  if (e.target.classList.contains("del")){ put(e.target.closest(".slot"), null); return; }
  const slot = e.target.closest(".slot");
  if (slot && !e.target.closest("[contenteditable]")) select(slot);
});
grid.addEventListener("input", e=>{
  const f = e.target.dataset.f; if (!f) return;
  const i = idx(e.target.closest(".cell").querySelector(".slot"));
  state[i] = state[i] || {}; state[i][f] = e.target.textContent; save();
});
// pegar texto plano en campos editables
grid.addEventListener("paste", e=>{
  if (!e.target.closest("[contenteditable]")) return;
  const hasImg = [...(e.clipboardData?.items||[])].some(it=>it.type.startsWith("image/"));
  if (hasImg) return; // lo maneja el listener global
  e.preventDefault();
  document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
});

// reducir imagen para no llenar el almacenamiento
function shrink(file){
  return new Promise(res=>{
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = ()=>{
      const max = 700, r = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width*r); c.height = Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL(file.type==="image/jpeg" ? "image/jpeg" : "image/png", .9));
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); res(null); };
    im.src = url;
  });
}
function targetSlot(){
  if (selected) return selected;
  return [...document.querySelectorAll(".slot")].find(s=>!s.classList.contains("has")) || null;
}
async function addFile(file, slot){
  const src = await shrink(file); if (!src) return;
  slot = slot || targetSlot(); if (!slot) return;
  put(slot, src);
  // pasar automáticamente al siguiente recuadro vacío
  const next = [...document.querySelectorAll(".slot")].find(s=>!s.classList.contains("has"));
  select(next || null);
}
document.addEventListener("paste", e=>{
  const item = [...(e.clipboardData?.items||[])].find(it=>it.type.startsWith("image/"));
  if (!item) return;
  e.preventDefault();
  addFile(item.getAsFile());
});
// arrastrar y soltar
grid.addEventListener("dragover", e=>{ if (e.target.closest(".slot")) e.preventDefault(); });
grid.addEventListener("drop", e=>{
  const slot = e.target.closest(".slot"); if (!slot) return;
  e.preventDefault();
  const f = [...e.dataTransfer.files].find(f=>f.type.startsWith("image/"));
  if (f) addFile(f, slot);
});
// subir archivo
const fileInput = document.getElementById("file");
function pickFile(){ if (!targetSlot()){ alert("Todos los recuadros tienen imagen. Selecciona uno para reemplazarlo."); return; } fileInput.click(); }
fileInput.addEventListener("change", ()=>{ if (fileInput.files[0]) addFile(fileInput.files[0]); fileInput.value=""; });

function clearImages(){
  if (!confirm("¿Quitar todas las imágenes? Los textos se conservan.")) return;
  Object.values(state).forEach(s=>{ if (s) s.img = null; });
  document.querySelectorAll(".slot").forEach(s=>setImg(s,null));
  select(null); save();
}
// Protocolo ARKAIOS: el sistema guarda y restaura el contenido (Biblioteca y Comunidad).
const SAFE_IMG = /^(data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+|https:\/\/[^\s"'<>]+)$/;
window.ARKAIOS_getData = function(){
  return { cells: DATA.map((_,i)=>{ const s = state[i] || {}; return { abbr: s.abbr ?? DATA[i][0], name: s.name ?? DATA[i][1], img: s.img || null }; }) };
};
window.ARKAIOS_setData = function(data){
  if (!data || !Array.isArray(data.cells)) return;
  state = {};
  document.querySelectorAll(".cell").forEach((c,i)=>{
    const d = data.cells[i] || {};
    const img = typeof d.img === "string" && SAFE_IMG.test(d.img) ? d.img : null;
    state[i] = { abbr: String(d.abbr ?? ""), name: String(d.name ?? ""), img };
    c.querySelector('[data-f="abbr"]').textContent = state[i].abbr;
    c.querySelector('[data-f="name"]').textContent = state[i].name;
    setImg(c.querySelector(".slot"), img);
  });
  select(null); save();
};

function clearAll(){
  if (!confirm("¿Borrar TODO el contenido (textos e imágenes)? Esto deja la plantilla en blanco.")) return;
  state = {};
  document.querySelectorAll(".cell").forEach(c=>{
    setImg(c.querySelector(".slot"), null);
    c.querySelector('[data-f="abbr"]').textContent = "";
    c.querySelector('[data-f="name"]').textContent = "";
  });
  DATA.forEach((_,i)=>{ state[i] = {abbr:"", name:"", img:null}; });
  select(null); save();
}

// Imágenes compartidas: Autollenar / IA y arrastrar un logo a otro recuadro.
// Ctrl+V y soltar archivos los sigue manejando esta plantilla (reduce la imagen antes de guardarla en localStorage).
// Al arrastrar se intercambian solo los logos: los nombres son la lista fija numerada y lo que se acomoda es la imagen.
const slotEls = () => [...grid.querySelectorAll(".slot")];
if (window.ArkImagenes) ArkImagenes.init({
  slots: slotEls,
  get: i => (state[i] && state[i].img) || null,
  set: (i, src) => {
    const slot = slotEls()[i]; if (!slot) return;
    put(slot, src);
    select(slotEls().find(s => !s.classList.contains("has")) || slot);
  },
  swap: (a, b) => {
    const els = slotEls(), ia = (state[a] && state[a].img) || null, ib = (state[b] && state[b].img) || null;
    put(els[a], ib); put(els[b], ia); select(els[b]);
  },
  toolbar: ".toolbar", toolbarPosition: "after",
  orientation: "square",
  aiHint: "logotipo institucional sencillo, fondo blanco, sin texto",
  paste: false, drop: false
});
</script>
</body>
</html>
